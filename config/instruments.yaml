# Instrument specs for The5ers MT5 + the matching Dukascopy feed used for research.
#
# verified: false means the value is a placeholder. Run the MT5 export script
# (mql5/Scripts/ExportResearchData.mq5) on your terminal: it writes the exact
# symbol names, contract sizes, swaps and margin per lot, and we update this file.
#
# Prices are in quote currency. "point" is the smallest price step used for
# spreads/slippage. Session hours are server time (EET/EEST).
# Spread snapshot (Market Watch, one moment, not an average; bid/ask shown):
#   EURUSD 0.0 pip, GBPJPY 2.3 pips, XAUUSD $0.52, NAS100 1.98 pts,
#   US30 3.36 pts, XTIUSD $0.08, BTCUSD $3.8. Hourly medians come from the MT5 export.
#
# Commission: per_lot_rt = USD per lot round trip; pct_notional_rt = % of notional round trip.

EURUSD:
  mt5_symbol: EURUSD            # confirmed (Market Watch)
  dukascopy: {code: EURUSD, divisor: 100000, sane_range: [0.8, 1.6]}
  contract_size: 100000
  quote_ccy: USD
  point: 0.00001
  min_lot: 0.01
  lot_step: 0.01
  commission: {type: per_lot_rt, value: 4.0}
  spread_markup_points: 0       # extra on top of Dukascopy's historical spread
  slippage_points: {entry: 2, stop: 5}
  swap_per_lot: {long: 0.0, short: 0.0, triple_day: wednesday, weekend_multiplier: 1}
  margin_per_lot_usd: null      # from MT5 export (OrderCalcMargin)
  session: {open: "00:05", close: "23:55"}
  verified: false

GBPJPY:
  mt5_symbol: GBPJPY            # confirmed (Market Watch)
  dukascopy: {code: GBPJPY, divisor: 1000, sane_range: [100, 260]}
  contract_size: 100000
  quote_ccy: JPY
  usd_conversion: {symbol: USDJPY, invert: true, fallback_rate: 0.0068}
  point: 0.001
  min_lot: 0.01
  lot_step: 0.01
  commission: {type: per_lot_rt, value: 4.0}
  spread_markup_points: 0
  slippage_points: {entry: 3, stop: 8}
  swap_per_lot: {long: 0.0, short: 0.0, triple_day: wednesday, weekend_multiplier: 1}
  margin_per_lot_usd: null
  session: {open: "00:05", close: "23:55"}
  verified: false

